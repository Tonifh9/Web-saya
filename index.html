<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Web Selling | Develope by Rafi</title>

  <meta name="description" content="Web Selling - Jasa pembuatan website modern, minimalis, dan responsif oleh Rafi.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #020617;
      color: #f8fafc;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* NAVBAR */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(59, 130, 246, 0.15);
    }

    nav {
      max-width: 1150px;
      margin: auto;
      height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #1683ff;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: #cbd5e1;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #1683ff;
    }

    .nav-button {
      background: #087cf5;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }

    .nav-button:hover {
      transform: translateY(-2px);
      background: #2563eb;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      max-width: 1150px;
      margin: auto;
      padding: 130px 20px 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 50px;
    }

    .hero-text {
      max-width: 600px;
    }

    .small-title {
      color: #1683ff;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: clamp(45px, 7vw, 78px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #1683ff;
    }

    .hero p {
      color: #94a3b8;
      font-size: 18px;
      max-width: 540px;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .secondary-btn {
      padding: 14px 24px;
      border-radius: 9px;
      font-weight: bold;
      transition: 0.3s;
      display: inline-block;
    }

    .primary-btn {
      background: #087cf5;
    }

    .primary-btn:hover {
      transform: translateY(-3px);
      background: #2563eb;
      box-shadow: 0 10px 30px rgba(8, 124, 245, 0.3);
    }

    .secondary-btn {
      border: 1px solid #1e3a5f;
      color: #cbd5e1;
    }

    .secondary-btn:hover {
      border-color: #1683ff;
      color: #1683ff;
    }

    /* CODE BOX */
